{% extends "layouts/base.html" %}
{% load static %}

{% block title %}Book List{% endblock title %}

{% block content %}
<div class="container">
    <h1>Book List</h1>
    
    {% for obj in books %}
        <p><strong>ID:</strong> {{ obj.id }}, <strong>Title:</strong> {{ obj.title }}</p>
        <hr>
    {% empty %}
        <p>No books found.</p>
    {% endfor %}
</div>
{% endblock content %}

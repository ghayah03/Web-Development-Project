{% extends "layouts/base.html" %}
{% load static %}

{% block title %}Lab10 - Add Book{% endblock title %}

{% block content %}
<div class="container">
    <h1>Add New Book</h1>
    
    <form method="post">
        {% csrf_token %}
        <div>
            <label>Title:</label>
            <input type="text" name="title" required>
        </div>
        <div>
            <label>Author:</label>
            <input type="text" name="author" required>
        </div>
        <div>
            <label>Price:</label>
            <input type="number" step="0.01" name="price" required>
        </div>
        <div>
            <label>Edition:</label>
            <input type="number" name="edition" value="1">
        </div>
        <div>
            <button type="submit">Save</button>
            <a href="{% url 'books.lab10_part1_listbooks' %}">Cancel</a>
        </div>
    </form>
</div>
{% endblock content %}

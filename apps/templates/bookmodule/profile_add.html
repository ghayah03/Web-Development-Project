{% extends "layouts/base.html" %}
{% load static %}

{% block title %}Add Profile{% endblock title %}

{% block content %}
<div class="container">
    <h1>Add New Profile</h1>
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
        <a href="{% url 'profile_list' %}">Cancel</a>
    </form>
</div>
{% endblock content %}

{% with request.resolver_match.url_name as url_name %}

<div class="topnav">
    <a class="{% if url_name == 'books.index' %}active{% endif %}" href="{% url 'books.index' %}">Home</a>
    <a class="{% if url_name == 'books.list_books' %}active{% endif %}" href="{% url 'books.list_books' %}">List Books</a>
    <a class="{% if url_name == 'books.aboutus' %}active{% endif %}" href="{% url 'books.aboutus' %}">About</a>
    
    <div class="dropdown">
        <a class="dropbtn">HTML5 Examples ▼</a>
        <div class="dropdown-content">
            <a href="{% url 'books.html_links' %}">Links</a>
            <a href="{% url 'books.html_formatting' %}">Text Formatting</a>
            <a href="{% url 'books.html_listing' %}">Listing</a>
            <a href="{% url 'books.html_tables' %}">Tables</a>
        </div>
    </div>
    
    
    {% if user.is_authenticated %}
        <a href="{% url 'logout' %}" style="float:right;">Logout ({{ user.username }})</a>
    {% else %}
        <a href="{% url 'login' %}" style="float:right;">Login</a>
        <a href="{% url 'register' %}" style="float:right;">Register</a>
    {% endif %}
</div>

{% endwith %}
